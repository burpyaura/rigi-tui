[package]
name = "rigi-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client for Rigi TV streaming (entitlement-respecting)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
dirs = "5"
rand = "0.8"

[profile.release]
strip = true
lto = true
